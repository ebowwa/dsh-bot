# DSH settings for the GLM CI bot.
# Copied to $DSH_HOME/settings.yaml on first run by run-dsh-agent.sh.
#
# llm-pi-ai: provider routes for the pi-ai multi-provider adapter. The `zai`
# route is hand-declared (pi-ai ships nothing under this key): OpenAI-compatible
# wire protocol against Z.AI's coding PAAS endpoint. apiKeyEnv is a credential
# *reference* — ZAI_API_KEY must exist in the process env (Doppler injects it);
# no secret lives in this file.
#
# The models list is the live endpoint catalog (verified against the /models
# API) so per-run overrides (DSH_MODEL=zai/<id>) resolve.
#
# agent-default-model: the fleet default; per-run DSH_MODEL rewrites it.

agent-default-model:
  provider: zai
  model: glm-5.3

llm-pi-ai:
  providers:
    zai:
      displayName: Z.AI Coding Plan
      apiKeyEnv: ZAI_API_KEY
      api: openai-completions
      baseURL: https://api.z.ai/api/coding/paas/v4
      models:
        - id: glm-5.3
          name: GLM-5.3
          contextWindow: 1000000
          maxTokens: 131072
        # A/B lane twin of the flagship: same coding-plan pricing, faster.
        # Present so per-run overrides (DSH_MODEL=zai/glm-5.3-flash) resolve.
        - id: glm-5.3-flash
          name: GLM-5.3 Flash
          contextWindow: 1000000
          maxTokens: 128000
        - id: glm-5.2
          name: GLM-5.2
          contextWindow: 1000000
          maxTokens: 131072
        - id: glm-5.1
          name: GLM-5.1
          contextWindow: 202752
          maxTokens: 32768
        - id: glm-5-turbo
          name: GLM-5 Turbo
          contextWindow: 204800
          maxTokens: 131072
        - id: glm-5
          name: GLM-5
          contextWindow: 204800
          maxTokens: 131072
        - id: glm-4.7
          name: GLM-4.7
          contextWindow: 200000
          maxTokens: 65536
        - id: glm-4.6
          name: GLM-4.6
          contextWindow: 200000
          maxTokens: 65536
        - id: glm-4.5
          name: GLM-4.5
          contextWindow: 131072
          maxTokens: 65536
        - id: glm-4.5-air
          name: GLM-4.5 Air
          contextWindow: 131072
          maxTokens: 65536
