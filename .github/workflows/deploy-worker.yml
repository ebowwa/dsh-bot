# deploy-worker — ONE-DISPATCH install of the out-of-band worker on a
# factory box (the self-register-factory pattern: workflows may install
# persistent per-user services on self-hosted runners; cron keepalive
# needs no sudo — issue #6's systemd path remains the upgrade when sudo
# exists).
#
# After this runs once on a box, that box serves the decoupled pipeline:
# /dsh tasks and /review requests flow through the queue labels, and NO
# Actions job ever holds a self-hosted runner for the agent or a review
# (the activation sweep below is the deliberate one-time exception).
#
# The worker's credentials land ONLY in ~/.dsh-worker/env (0600, written
# by scripts/install-worker.sh from this run's secrets — the documented
# deployment pattern in docs/decoupled-worker.md). The cron line never
# contains a token; the toolkit re-pins to the moving `v1` tag each sweep,
# so the worker's code updates exclusively through drift-check's audited
# releases.
#
# Steps: install (idempotent) → box diagnostics (is the keepalive actually
# alive? crond present? any sweeps ever run?) → ONE-TIME activation sweep
# that runs the worker in-job (deliberately holds THIS runner for up to
# the task budget, once per deploy, to claim and complete whatever is
# already queued — steady-state is the keepalive's job, not this step's).

name: deploy-worker

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "DSH_WORKER_REPOS — space-separated owner/repo list this box serves"
        type: string
        default: "ebowwa/dsh-bot"
      model-map:
        description: "DSH_WORKER_MODEL_MAP — space-separated owner/repo=provider/model per-repo overrides (optional)"
        type: string
        default: ""
      activation-sweep:
        description: "Run one real sweep in-job after install (claims + completes any queued item; holds this runner for that duration — one-time per deploy)"
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: [self-hosted, dsh]
    timeout-minutes: 60
    steps:
      - name: Checkout the toolkit (the installer ships with it)
        uses: actions/checkout@v4

      # Lane impact: one job per deploy (workflow_dispatch only). The
      # activation sweep holds this runner for up to the task budget —
      # deliberate, once per deploy (input-gated).
      - name: Install the worker on this box (idempotent)
        env:
          WORKER_GH_CRED: ${{ secrets.BOT_PAT }}
          WORKER_DOPPLER_CRED: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
          WORKER_REPOS: ${{ inputs.repos }}
          WORKER_MODEL_MAP: ${{ inputs.model-map }}
        run: |
          set -euo pipefail
          bash scripts/install-worker.sh

      - name: Box diagnostics (keepalive viability)
        run: |
          set -uo pipefail
          echo "box: ${RUNNER_NAME:-unknown} ($(uname -s) $(uname -m))"
          echo "--- installed crontab (dsh lines) ---"
          crontab -l 2>/dev/null | grep -F "dsh-worker.sh" || echo "(no dsh-worker crontab line!)"
          echo "--- cron daemon ---"
          pgrep -x cron >/dev/null 2>&1 && echo "cron: running" || echo "cron: NOT running"
          pgrep -x crond >/dev/null 2>&1 && echo "crond: running" || echo "crond: NOT running"
          command -v systemctl >/dev/null 2>&1 && echo "systemd: present" || echo "systemd: absent"
          sudo -n true 2>/dev/null && echo "passwordless sudo: YES" || echo "passwordless sudo: no"
          echo "--- worker home ---"
          ls -la "$HOME/.dsh-worker" 2>/dev/null || echo "(no worker home)"
          echo "--- worker.log (last 15 lines, if any) ---"
          tail -n 15 "$HOME/.dsh-worker/worker.log" 2>/dev/null | node scripts/scrub-output.mjs || echo "(no worker.log — no sweep has ever run)"
          echo "--- worker.log: the LAST task block, whole ---"
          awk '/==== worker \[t/{buf=""} {buf=buf $0 "\n"} END{printf "%s", buf}' "$HOME/.dsh-worker/worker.log" 2>/dev/null | tail -30 | node scripts/scrub-output.mjs || echo "(no task block yet)"
          echo "--- cron-eye repro: the poll EXACTLY as cron runs it ---"
          env -i HOME="$HOME" PATH=/usr/bin:/bin /bin/bash -c 'set -a; . "$HOME/.dsh-worker/env"; set +a; gh api "repos/ebowwa/dsh-bot/issues?state=open&labels=dsh/review&per_page=100" --jq ".[].number" 2>&1 | head -5' || true
          echo "--- tool locations (cron PATH is /usr/bin:/bin) ---"
          for t in git node gh flock doppler; do command -v "$t" || echo "$t: NOT FOUND on job PATH"; done
          echo "--- systemctl --user (keepalive fallback probe) ---"
          systemctl --user is-system-running 2>&1 || true
          loginctl show-user "$USER" -p Linger 2>&1 || true

      - name: Activation sweep (one-time, in-job)
        if: ${{ inputs.activation-sweep }}
        run: |
          set -uo pipefail
          echo "running one real sweep in-job (claims + completes any queued item; steady-state is the keepalive's job)"
          set -a; . "$HOME/.dsh-worker/env"; set +a
          bash "$DSH_BOT_DIR/scripts/dsh-worker.sh" --once 2>&1 | node scripts/scrub-output.mjs