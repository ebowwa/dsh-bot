# canary — standalone probe of the scripts-checkout shape (private-mode).
name: canary
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dsh-bot scripts (pinned ref)
        uses: actions/checkout@v4
        with:
          repository: ebowwa/dsh-bot
          ref: v1
          path: .dsh-bot
          token: ${{ secrets.DSH_BOT_REPO_TOKEN }}
      - run: ls .dsh-bot/scripts | head -5
