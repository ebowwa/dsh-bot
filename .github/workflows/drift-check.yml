# drift-check — the self-reviewing release agent.
#
# When scripts or reusable workflows change on main, this agent:
#   1. computes the next minor tag,
#   2. REVIEWS its own diff (agent pass): what changed, is any consumer's
#      shell input broken, is the change safe to auto-propagate,
#   3. tags ONLY if the review approves (TAG or TAG-WITH-FINDINGS; findings
#      ride along as release notes),
#   4. writes a release on the tag with the agent's review as notes,
#   5. notifies registered consumers (DSH_BOT_CONSUMERS repo variable) via
#      repository_dispatch so each can open its own bump PR.
#
# BLOCK verdict: no tag, red run — scripts/drift-verdict.mjs dumps the
# scrubbed review body to the run log (run 32568700263 blocked with the body
# stranded in $RUNNER_TEMP, wiped with the runner: a human got one word) —
# a human decides.
# Model: fleet default unless DSH_DRIFT_MODEL is set on this repo.

name: drift-check

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/agent-*.yml'
      - 'config/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: drift-check
  cancel-in-progress: true

jobs:
  drift:
    runs-on: [self-hosted, dsh]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: What changed since the last tag?
        id: scope
        run: |
          set -euo pipefail
          git fetch --tags -q
          LATEST="$(git tag -l 'v1.*' --sort=-v:refname | head -1)"
          if [ -z "$LATEST" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
            MAJOR=1; MINOR=0
          else
            BASE="$LATEST"
            MAJOR="${LATEST#v}"; MAJOR="${MAJOR%%.*}"
            MINOR="${LATEST#v*.}"; MINOR="${MINOR%%.*}"
          fi
          NEXT="v${MAJOR}.$((MINOR+1)).0"
          {
            echo "base=$BASE"
            echo "latest=${LATEST:-none}"
            echo "next=$NEXT"
          } >> "$GITHUB_OUTPUT"
          echo "--- diff scope $BASE..HEAD ---"
          git diff --stat "$BASE..HEAD" -- scripts '.github/workflows/agent-*.yml' config | tail -5

      - name: Agent reviews its own diff (release gate)
        env:
          DOPPLER_SERVICE_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.scope.outputs.base }}
        run: |
          set -euo pipefail
          MASK="DSH-DRIFT-MASK-4f7a"
          echo "::add-mask::${MASK}"
          command -v doppler >/dev/null 2>&1 \
            && doppler run --token "$DOPPLER_SERVICE_TOKEN" -- \
                 sh -c 'printf "::add-mask::%s\n" "$ZAI_API_KEY"' || true

          TASK="You are the RELEASE stage of dsh-bot — the toolkit other repos run on their own runners. A change landed on main; decide whether it is safe to tag and propagate.

          Scope: git diff ${BASE}..HEAD (scripts/, agent-*.yml workflows, config/).
          Method:
          1. Read the full diff of every changed file.
          2. For each reusable workflow: are all previously valid consumer
             'with:' inputs still valid? A NEW REQUIRED input is a breaking
             change -> say MAJOR in findings.
          3. For each script: behavioral changes consumers could depend on?
             Env-contract changes (new required DSH_*/env vars) are breaking.
          4. Validate syntax of changed scripts (node --check / bash -n).
          5. This is a STATIC review — do not run the agent loop or network.

          Write your review to $RUNNER_TEMP/drift-review.md with exactly:
            ## Verdict: TAG | TAG-WITH-FINDINGS | BLOCK
            ## What changed (one line per file)
            ## Consumer impact (which inputs/env/behaviors shifted)
            ## Findings (numbered, severity)
          Then reply with ONLY the single verdict word, nothing else.
          Never print secrets or absolute paths."

          export REPLY_TARGET=""
          bash scripts/run-dsh-agent.sh "$TASK" \
            | node scripts/scrub-output.mjs \
            | tee "$RUNNER_TEMP/drift-out.txt"
          # Strict verdict extraction + review-body surfacing (the script
          # header documents the incident). The body is printed to this log
          # on EVERY verdict — BLOCK most of all, where no release exists to
          # carry it; stdout carries only the verdict word.
          VERDICT="$(node scripts/drift-verdict.mjs \
            "$RUNNER_TEMP/drift-out.txt" "$RUNNER_TEMP/drift-review.md")"
          {
            echo "VERDICT=$VERDICT"
          } >> "$GITHUB_ENV"
          echo "release-review verdict: ${VERDICT:-none}"

      - name: Tag + release + notify (only on TAG verdicts)
        env:
          GH_TOKEN: ${{ github.token }}
          # repository_dispatch to CONSUMER repos needs a PAT (github.token
          # is repo-scoped); falls back gracefully for public-mode consumers.
          PAT_TOKEN: ${{ secrets.DSH_BOT_REPO_TOKEN }}
          NEXT: ${{ steps.scope.outputs.next }}
          VERDICT: ${{ env.VERDICT }}
        run: |
          set -euo pipefail
          case "$VERDICT" in
            TAG|TAG-WITH-FINDINGS) echo "verdict $VERDICT — tagging $NEXT";;
            *) echo "verdict '${VERDICT:-none}' — NOT tagging; see the review above"; exit 1;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEXT"
          git push origin "$NEXT"
          if [ -f "$RUNNER_TEMP/drift-review.md" ]; then
            gh release create "$NEXT" --title "$NEXT" --notes-file "$RUNNER_TEMP/drift-review.md"
          else
            gh release create "$NEXT" --title "$NEXT" --notes "Automated release ${NEXT}. Agent review body unavailable; see the run log."
          fi
          # advance the moving major tag
          git tag -f v "$NEXT" && git push -q -f origin v
          # notify registered consumers so each opens its own bump PR
          CONSUMERS="$(printf '%s' "${{ vars.DSH_BOT_CONSUMERS }}" | tr ',[:space:]' '\n')"
          while read -r repo; do
            [ -n "$repo" ] || continue
            DISPATCH_TOKEN="${PAT_TOKEN:-$GH_TOKEN}"
            gh api "repos/$repo/dispatches" --method POST \
              -H "Authorization: Bearer $DISPATCH_TOKEN" \
              -f event_type="dsh-bot-release" \
              -F "client_payload[tag]=${NEXT}" 2>/dev/null \
              && echo "notified $repo" || echo "notify failed: $repo"
          done <<< "$CONSUMERS"
