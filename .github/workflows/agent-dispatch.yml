# dsh-bot: agent-dispatch — manual/scheduled task entry as a REUSABLE workflow.

name: agent-dispatch

on:
  workflow_call:
    inputs:
      task:
        description: "Task text (empty = caller supplies DEFAULT_TASK env)"
        type: string
        default: ""
      base-ref:
        description: "Ref to start from"
        type: string
        default: ""
      runner:
        description: "Lane: auto | big | mac | linux"
        type: string
        default: "auto"
      model:
        description: "Model for this run: provider/model (e.g. zai/glm-5.2). Empty = fleet default"
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 120
      review-workflow:
        type: string
        default: "dsh-review.yml"
      dsh-bot-ref:
        type: string
        default: ""

jobs:
  dsh-agent:
    runs-on: >-
      ${{ inputs.runner == 'big' && fromJSON('["self-hosted","dsh","big"]')
      || inputs.runner == 'mac' && fromJSON('["self-hosted","dsh","macOS"]')
      || inputs.runner == 'linux' && fromJSON('["self-hosted","dsh","Linux"]')
      || fromJSON('["self-hosted","dsh"]') }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base-ref || github.ref }}

      - name: Fetch dsh-bot scripts
        uses: actions/checkout@v4
        with:
          repository: ebowwa/dsh-bot
          # dsh-bot-ref when given; else MAIN — never github.ref: the
          # CALLER may fire this workflow from a target repo whose default
          # branch is not main (ANE: dev), and dsh-bot has no such branch —
          # the fetch died with "couldn't find remote ref refs/heads/dev"
          # on every cross-repo tower review (observed 2026-08-24).
          ref: ${{ inputs.dsh-bot-ref || 'main' }}
          path: .dsh-bot
          token: ${{ secrets.DSH_BOT_REPO_TOKEN || github.token }}

      - name: Run agent
        env:
          DOPPLER_SERVICE_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
          GH_TOKEN: ${{ secrets.BOT_PAT || github.token }} # BOT_PAT: cross-repo pushes (tower tickets ship PRs in target repos)
          TASK_INPUT: ${{ inputs.task }}
          DSH_KEEP_SESSIONS: "1" # flight recorder: keep the session transcript for the artifact upload # env, never raw ${{ }} into bash (injection seam)
          DSH_MODEL: ${{ inputs.model }}
          DSH_BOT_DIR: ${{ github.workspace }}/.dsh-bot
        run: |
          set -euo pipefail
          echo "DSH_RUNNER_NAME=${RUNNER_NAME:-unknown}" >> "$GITHUB_ENV"
          TASK="${TASK_INPUT}"
          [ -n "$TASK" ] || TASK="${DEFAULT_TASK:?no task given}"
          export REPLY_TARGET=""
          bash "$DSH_BOT_DIR/scripts/run-dsh-agent.sh" "$TASK" \
            | node "$DSH_BOT_DIR/scripts/scrub-output.mjs" \
            | tee "$RUNNER_TEMP/dsh-agent-output.txt"

      # FLIGHT RECORDER: the full session transcript (every reasoning
      # chunk, tool call, result — the complete generation, not the
      # summary) goes to the tower-state branch under data/sessions/ —
      # the same shared-memory ref as the ledger. Artifact storage hit
      # the org quota on its FIRST upload (2026-08-24); branch storage
      # is the fleet's existing memory pattern. Best-effort: never
      # fails the agent run.
      - name: Archive session transcript (flight recorder)
        if: always() && env.DSH_HOME_JOB != ''
        env:
          GH_TOKEN: ${{ secrets.DSH_BOT_REPO_TOKEN || github.token }}
        run: |
          set -euo pipefail
          [ -d "${DSH_HOME_JOB}/sessions" ] || { echo "no sessions dir"; exit 0; }
          WORK=$(mktemp -d)
          cd "$WORK"
          git init -q .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q origin tower-state || true
          git checkout -q -B tower-state origin/tower-state 2>/dev/null || git checkout -q -B tower-state
          mkdir -p data/sessions
          cp -R "${DSH_HOME_JOB}/sessions/." data/sessions/run-${{ github.run_id }}/
          # size discipline: keep the newest 100 transcripts
          ls -t data/sessions | tail -n +101 | xargs -r rm -rf
          git add -f data/sessions
          git commit -qm "flight recorder: session ${{ github.run_id }} [skip ci]" || exit 0
          git push -q origin tower-state || echo "::warning::transcript push failed (best-effort)"
