# dsh-review shell for dsh-bot — DECOUPLED: enqueues the review; the
# out-of-band worker (scripts/dsh-worker.sh, dsh/review label) runs
# scripts/review-pr.sh. The legacy path (agent-review.yml on a held
# [self-hosted, dsh] runner for up to 45 min per review) is retired for
# THIS repo — dogfooding the decouple the repo ships.
name: dsh review

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to review"
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: dsh-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  # false is load-bearing: the tower re-fires reviews on unreviewed PRs
  # every tick; cancel-in-progress would kill a running (enqueued) review.
  cancel-in-progress: false

jobs:
  dsh-review:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pr != '')
      || (github.event_name == 'issue_comment'
          && startsWith(github.event.comment.body, '/review')
          && github.event.comment.user.type != 'Bot'
          && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
          && github.event.issue.pull_request)
    # @v1 (the moving major tag drift-check advances on TAG verdicts) —
    # NOT @main: an unpinned main ref means every merge instantly changes
    # this repo's own review path with no audit gate between (drift
    # finding 1 on v1.46.0).
    uses: ebowwa/dsh-bot/.github/workflows/agent-review-thin.yml@v1
    secrets: inherit
    with:
      # workflow_dispatch passes inputs.pr; the /review comment path
      # resolves the PR number from the issue the comment belongs to.
      pr: ${{ inputs.pr || github.event.issue.number }}