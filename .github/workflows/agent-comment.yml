# dsh-bot: agent-comment — the comment-triggered agent loop as a REUSABLE
# workflow (LEGACY execution mode).
#
# NOTE: consumers should adopt the DECOUPLED mode instead —
# examples/dsh-agent-thin.yml calls agent-comment-thin.yml, a ~20s
# trigger on the self-hosted dsh lane (owner directive: nothing on
# github-hosted) that acks + enqueues; the out-of-band worker
# (scripts/dsh-worker.sh, running on the factory pool boxes) runs the agent,
# ships, replies, and reviews — no DOPPLER_SERVICE_TOKEN/DSH_BOT_REPO_TOKEN
# in the consumer.
#
# This workflow remains for the migration window: it executes the agent
# INSIDE the Actions job that holds the runner for up to timeout-minutes.
# Behavior here is unchanged (the shipper + reply steps moved into
# scripts/ship-changes.sh + scripts/post-reply.sh, ported 1:1).
#
# Runs in the CALLER's context: caller's runners, caller's GITHUB_TOKEN,
# caller's secrets. dsh-bot itself needs no runners.
#
# Inputs (all optional — sane defaults):
#   lanes          JSON-ish lane mapping hint. Default routes like the
#                  tracker: --big→big lanes, --mac→macOS, --linux→Linux,
#                  no hint→any idle dsh runner.
#   review-workflow  Filename of the review workflow to auto-dispatch after
#                  shipping. Default "dsh-review.yml". Empty string disables
#                  review dispatch.
#   timeout-minutes Per-run cap. Default 120.
#
# Required by the caller:
#   secrets: DOPPLER_SERVICE_TOKEN (Z.AI key via Doppler)
#   runners: labeled dsh (+big on heavy lanes)

name: agent-comment

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: "Per-run cap in minutes"
        type: number
        default: 120
      review-workflow:
        description: "Review workflow filename to dispatch after shipping (empty disables)"
        type: string
        default: "dsh-review.yml"
      lanes-enabled:
        description: "Enable --big/--mac/--linux lane routing from comment prefixes"
        type: boolean
        default: true
      dsh-bot-ref:
        description: "Git ref of ebowwa/dsh-bot to fetch scripts from (defaults to the called workflow's own pinned ref)"
        type: string
        default: ""
      model:
        description: "Model for this run: provider/model (e.g. zai/glm-5.2). Empty = fleet default (zai/glm-5.3)"
        type: string
        default: ""
      subagent-model:
        description: "Model for the subagent/subagent_fork children: provider/model (e.g. zai/glm-5-turbo). Empty = inherit the head's model"
        type: string
        default: ""
      extra-scrub-hosts:
        description: "Comma-separated hostnames to redact on output surfaces (runner fleet names — this file is public, hosts are consumer-private)"
        type: string
        default: ""
      web-search-browser-cells:
        description: "Comma-separated runner names where the local web-search-browser provider is mounted. Per-cell and default-off: list a runner ONLY after its cell passed the adoption gates (resolvable plugin copy, dsh version parity, live search+fetch smoke)"
        type: string
        default: ""

jobs:
  dsh-agent-comment:
    runs-on: >-
      ${{ inputs.lanes-enabled
      && (startsWith(github.event.comment.body, '/dsh --big') || startsWith(github.event.comment.body, '@dsh-agent --big')) && fromJSON('["self-hosted","dsh","big"]')
      || inputs.lanes-enabled
      && (startsWith(github.event.comment.body, '/dsh --mac') || startsWith(github.event.comment.body, '@dsh-agent --mac')) && fromJSON('["self-hosted","dsh","macOS"]')
      || inputs.lanes-enabled
      && (startsWith(github.event.comment.body, '/dsh --linux') || startsWith(github.event.comment.body, '@dsh-agent --linux')) && fromJSON('["self-hosted","dsh","Linux"]')
      || fromJSON('["self-hosted","dsh"]') }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Ack the thread instantly (before any work)
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || github.token }}
          TARGET_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -uo pipefail
          ACK_BODY="**dsh agent (GLM-5.3)** — run: ${GITHUB_RUN_ID} — lane: ${RUNNER_NAME:-pending}

          :hourglass_flowing_sand: Started — working on it. Live trace: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          _(this comment will be edited with the result — watch the trace meanwhile)_"
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${TARGET_NUM}/comments"             -f body="$ACK_BODY" --jq .id 2>/dev/null || true)"
          if [ -n "$ID" ]; then echo "ACK_COMMENT_ID=$ID" >> "$GITHUB_ENV"; fi

      - name: Checkout the repo (caller's context)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.event.issue.pull_request && format('refs/pull/{0}/merge', github.event.issue.number) || '' }}
          # persist-credentials: false — the shipper's `git push` (below)
          # and the agent's must not ride the ephemeral GITHUB_TOKEN
          # (github-actions[bot]): it can never push workflow-file edits,
          # and a bot-actor push onto a workflow-touching PR parks its
          # runs in action_required (factory #229). The resolve step after
          # the toolkit fetch writes the real credential.
          persist-credentials: false

      - name: Fetch dsh-bot scripts (pinned ref)
        uses: actions/checkout@v4
        with:
          repository: ebowwa/dsh-bot
          ref: ${{ inputs.dsh-bot-ref || github.ref }}
          path: .dsh-bot
          token: ${{ secrets.DSH_BOT_REPO_TOKEN || github.token }}
        # The reusable workflow's own repo is not auto-checked-out.

      # Lane impact: none — same runners, one added step (a doppler fetch +
      # one bounded curl per run, ~2-4s). Must run BEFORE the agent and the
      # shipper: both push through the workspace git config it writes.
      - name: Push credential (Doppler-first)
        # Doppler seed/prd GITHUB_TOKEN when its scopes cover repo+workflow,
        # else DSH_BOT_REPO_TOKEN (documented PAT with workflow scope), else
        # github.token (= exactly today's behavior). Decision line in this
        # step's log; the token only ever reaches the local git config.
        env:
          DOPPLER_SERVICE_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
          PUSH_FALLBACK_CRED: ${{ secrets.DSH_BOT_REPO_TOKEN || github.token }}
        run: bash "${GITHUB_WORKSPACE}/.dsh-bot/scripts/resolve-push-token.sh"

      - name: Run agent (captures the before-state for the shipper)
        env:
          DOPPLER_SERVICE_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
          GH_TOKEN: ${{ secrets.BOT_PAT || github.token }}
          # (comment body + task come from GITHUB_EVENT_PATH on disk — the
          # runner dumps step env: to the log, and user text is not a secret)
          TARGET_KIND: ${{ (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) && 'pr' || 'issue' }}
          TARGET_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
          EXTRA_SCRUB_HOSTS: ${{ inputs.extra-scrub-hosts }}
          DSH_MODEL: ${{ inputs.model }}
          DSH_SUBAGENT_MODEL: ${{ inputs.subagent-model }}
          DSH_WEB_SEARCH_CELLS: ${{ inputs.web-search-browser-cells }}
          DSH_BOT_DIR: ${{ github.workspace }}/.dsh-bot
        run: |
          set -euo pipefail
          echo "DSH_RUNNER_NAME=${RUNNER_NAME:-unknown}" >> "$GITHUB_ENV"

          COMMENT_BODY="$(node -e '
            const e = JSON.parse(require("fs").readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
            process.stdout.write(e.comment?.body ?? "");
          ')"
          TASK="${COMMENT_BODY#/dsh }"
          TASK="${TASK#@dsh-agent }"
          TASK="${TASK#@dsh-agent: }"
          TASK="$(echo "$TASK" | sed -E 's/^--(big|mac|linux)([[:space:]]+|$)//' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$TASK" ]; then
            echo "Empty task after stripping the trigger; nothing to do." >&2
            exit 0
          fi

          # Thread context: the issue/PR this comment belongs to.
          {
            gh issue view "$TARGET_NUM" --repo "$GITHUB_REPOSITORY" \
              --json title,body \
              --jq '"title: " + .title + "\nbody (truncated):\n" + ((.body // "")[0:1600])' || true
            echo
            echo "recent comments (last 8, truncated):"
            gh api "repos/${GITHUB_REPOSITORY}/issues/${TARGET_NUM}/comments?per_page=100" \
              --jq '.[-8:][] | "- " + .user.login + ": " + ((.body // "") | gsub("[\\r\\n]+"; " ") | .[0:280])' || true
          } > "$RUNNER_TEMP/dsh-thread-context.txt" 2>/dev/null || true
          export THREAD_CONTEXT="$(cat "$RUNNER_TEMP/dsh-thread-context.txt" 2>/dev/null || true)"

          export REPLY_TARGET="${TARGET_KIND} #${TARGET_NUM}"
          export TARGET_KIND TARGET_NUM

          # BEFORE-state the shipper diffs against (ship-changes.sh contract)
          git rev-parse HEAD > "$RUNNER_TEMP/dsh-before-sha"
          git ls-remote origin 'refs/heads/dsh/*' 2>/dev/null | awk '{print $2}' \
            | sed 's|refs/heads/||' | sort > "$RUNNER_TEMP/dsh-before-dsh-branches" || true
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number --jq '.[].number' | sort -n > "$RUNNER_TEMP/dsh-before-open-prs" || true
          {
            echo "DSH_TASK_TITLE<<DSHEOF"
            echo "$TASK" | head -n1 | cut -c1-120 | iconv -f UTF-8 -t UTF-8 -c
            echo ""
            echo "DSHEOF"
          } >> "$GITHUB_ENV"

          # scrub BEFORE tee: the step's stdout IS the Actions log
          bash "$DSH_BOT_DIR/scripts/run-dsh-agent.sh" "$TASK" \
            | node "$DSH_BOT_DIR/scripts/scrub-output.mjs" \
            | tee "$RUNNER_TEMP/dsh-agent-output.txt"

      # Deterministic shipping (never trust the model to push) — logic lives
      # in scripts/ship-changes.sh, shared 1:1 with the decoupled worker.
      - name: Ship any code changes as a PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || github.token }}
          REVIEW_WORKFLOW: ${{ inputs.review-workflow }}
          EXTRA_SCRUB_HOSTS: ${{ inputs.extra-scrub-hosts }}
          DSH_BOT_DIR: ${{ github.workspace }}/.dsh-bot
        run: bash "${DSH_BOT_DIR}/scripts/ship-changes.sh"

      - name: Reply on the thread as github-actions[bot]
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || github.token }}
          TARGET_KIND: ${{ (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) && 'pr' || 'issue' }}
          TARGET_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
          EXTRA_SCRUB_HOSTS: ${{ inputs.extra-scrub-hosts }}
          DSH_BOT_DIR: ${{ github.workspace }}/.dsh-bot
        run: bash "${DSH_BOT_DIR}/scripts/post-reply.sh"