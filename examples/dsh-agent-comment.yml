# Consumer shell — .github/workflows/dsh-agent-comment.yml in YOUR repo.
# Everything else lives in ebowwa/dsh-bot's reusable workflow.

name: dsh agent (GLM) - comment

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dsh-agent-comment-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dsh-agent-comment:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
      && (startsWith(github.event.comment.body, '/dsh') || contains(github.event.comment.body, '@dsh-agent'))
      && github.event.comment.user.type != 'Bot'
      && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    uses: ebowwa/dsh-bot/.github/workflows/agent-comment.yml@v1
    secrets: inherit
    with:
      review-workflow: "dsh-review.yml"
      lanes-enabled: true
