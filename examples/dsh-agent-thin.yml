# Consumer shell (DECOUPLED mode) — .github/workflows/dsh-agent-thin.yml in
# YOUR repo. The WHOLE consumer side: a ~20s github-hosted trigger that
# acks + enqueues. No self-hosted runners, no DOPPLER_SERVICE_TOKEN, no
# DSH_BOT_REPO_TOKEN. The out-of-band worker (ebowwa's factory pool,
# scripts/dsh-worker.sh) runs the agent, ships, replies, and reviews.
#
# Watch the workflow run log for the "queued" confirmation; the ack comment
# on the thread is edited by the worker with the final answer + ship note.

name: dsh agent (GLM) - comment

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: dsh-agent-thin-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dsh-agent-thin:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
      && (startsWith(github.event.comment.body, '/dsh') || contains(github.event.comment.body, '@dsh-agent'))
      && github.event.comment.user.type != 'Bot'
      && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    uses: ebowwa/dsh-bot/.github/workflows/agent-comment-thin.yml@v1
    secrets: inherit